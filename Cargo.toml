[package]
name = "lora_inspector"
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/rockerBOO/lora-inspector-rs"
description = "Inspect and analyze LoRA files for diffusion models (UNet and DiT architectures like Stable Diffusion, Flux, and Krea), including network type, weight norms, rank health, and metadata, via CLI and WebAssembly."

[workspace]
members = ['crates/*']
resolver = "2"
package = {version = "1.6.1", authors = ['Dave Lage (rockerBOO)'], edition = "2021", license = "MIT", repository = "https://github.com/rockerBOO/lora-inspector-rs", description = "Inspect and analyze LoRA files for diffusion models (UNet and DiT architectures like Stable Diffusion, Flux, and Krea), including network type, weight norms, rank health, and metadata, via CLI and WebAssembly."}
dependencies = {candle-core = {version = "0.3.2"}, getrandom = {version = "0.2", features = ['js']}, num = "0.4.1", pest = "2.6", pest_derive = "2.6", safetensors = "0.3.1", serde = {version = "1.0", features = ['derive']}, serde_json = "1.0.108", serde_with = "3.4.0"}

[profile]
dev = {package = {insta = {opt-level = 3}}}
release = {lto = true, opt-level = "z", codegen-units = 1, incremental = false, package = {inspector = {opt-level = 3}}}

